# Настройки табличек. Все размеры — в миллиметрах, цвета — CMYK в процентах.
#
# Система координат одной грани: x — вдоль листа (0…297),
# y = 0 — нижний край (стол), y = 105 — линия сгиба.
# Верхняя половина листа печатается той же гранью, повёрнутой на 180°.

[sheet]
width = 297          # A4 альбомный
height = 210         # сгиб — посередине, на 105 мм
bleed = 3            # вылеты под обрез (только в файле для типографии)

[face]
margin = 8           # безопасный отступ от краёв листа
fold_margin = 8      # безопасный отступ от линии сгиба

[colors]
black = [0, 0, 0, 100]     # чистый чёрный (только краска K)
red = [0, 100, 100, 10]    # красный акцент: лента шляпы и брызги
white = [0, 0, 0, 0]       # «выворотка» под шляпой эмблемы
fold_mark = [0, 0, 0, 40]  # метки сгиба (только в офисной версии)

[name]
font = "assets/fonts/Neucha.ttf"   # любой TTF/OTF с кириллицей
variations = {}            # оси вариативного шрифта, например { wght = 800 }
uppercase = true           # писать ЗАГЛАВНЫМИ
embolden = 0.045           # утолщение букв (доля высоты заглавных); 0 — как в шрифте
max_cap = 34               # максимальная высота заглавных букв (ник в одну строку)
max_cap_multiline = 30     # максимальная высота заглавных, если ник в две строки
one_line_min_cap = 24      # в одну строку, пока буквы не мельче этого; иначе — перенос
min_cap = 16               # если буквы мельче — предупреждение
two_line_gain = 1.08       # переносить, только если буквы станут крупнее хотя бы на 8%
line_gap = 0.32            # просвет между строками (доля высоты заглавных)
min_line_chars = 3         # не оставлять в строке меньше 3 символов
v_center = 0.5             # вертикальное положение (0.5 — по центру зоны)
box = [46, 8, 232, 97]     # зона ника: x0, y0, x1, y1 (ник центрируется по середине листа, если влезает)

[emblem]                   # скрещённые томми-ганы и шляпа-федора
enabled = true
center = [264, 52.5]       # центр эмблемы
width = 42                 # ширина эмблемы
hat_width = 0.72           # ширина шляпы (доля ширины эмблемы)
hat_drop = 0.09            # насколько шляпа опущена от центра (доля ширины)
knockout = 1.1             # белая обводка шляпы поверх автоматов

[holes]                    # пулевые отверстия с трещинами и красными брызгами
enabled = true
zone = [8, 8, 41, 97]      # зона: x0, y0, x1, y1
count = 3
radius = [3.2, 4.2]        # радиус отверстия (от и до)
splatter = true            # красные брызги
gap = 0.6                  # минимальный зазор между красным и чёрным
